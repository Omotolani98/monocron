version: 2

project_name: monocron

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: monocron-controller
    main: ./cmd/monocron-controller
    binary: monocron-controller
    ldflags:
      - "-s -w -X github.com/Omotolani98/monocron/internal/platform/version.Version={{ .Version }} -X github.com/Omotolani98/monocron/internal/platform/version.Commit={{ .Commit }} -X github.com/Omotolani98/monocron/internal/platform/version.Date={{ .Date }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: monocron-runner
    main: ./cmd/monocron-runner
    binary: monocron-runner
    ldflags:
      - "-s -w -X github.com/Omotolani98/monocron/internal/platform/version.Version={{ .Version }} -X github.com/Omotolani98/monocron/internal/platform/version.Commit={{ .Commit }} -X github.com/Omotolani98/monocron/internal/platform/version.Date={{ .Date }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: monocrond
    main: ./cmd/monocrond
    binary: monocrond
    ldflags:
      - "-s -w -X github.com/Omotolani98/monocron/internal/platform/version.Version={{ .Version }} -X github.com/Omotolani98/monocron/internal/platform/version.Commit={{ .Commit }} -X github.com/Omotolani98/monocron/internal/platform/version.Date={{ .Date }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: monocronctl
    main: ./cmd/monocronctl
    binary: monocronctl
    ldflags:
      - "-s -w -X github.com/Omotolani98/monocron/internal/platform/version.Version={{ .Version }} -X github.com/Omotolani98/monocron/internal/platform/version.Commit={{ .Commit }} -X github.com/Omotolani98/monocron/internal/platform/version.Date={{ .Date }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: monocron-controller
    builds:
      - monocron-controller
    name_template: "monocron-controller_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    files:
      - deploy/systemd/*
      - deploy/docker/*
      - README.md

  - id: monocron-runner
    builds:
      - monocron-runner
    name_template: "monocron-runner_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    files:
      - deploy/systemd/*
      - deploy/docker/*
      - README.md

  - id: monocrond
    builds:
      - monocrond
    name_template: "monocrond_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    files:
      - deploy/systemd/*
      - deploy/docker/*
      - README.md

  - id: monocronctl
    builds:
      - monocronctl
    name_template: "monocronctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    files:
      - deploy/systemd/*
      - deploy/docker/*
      - README.md

release:
  github:
    owner: Omotolani98
    name: monocron

changelog:
  sort: asc
