version: 2

project_name: monocrond
builds:
  - id: monocrond
    main: ./main.go
    dir: ./monocrond
    binary: monocrond
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - id: default
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
release:
  github:
    owner: Omotolani98
    name: monocron
changelog:
  sort: asc
